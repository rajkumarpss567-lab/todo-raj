name: codegen_19_task_16

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DEBUG: "1"
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend,0.0.0.0"
      CORS_ALLOWED_ORIGINS: "http://localhost:21000"
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "21101:8000"
    volumes:
      - ./backend:/app
    mem_limit: 1g
    networks: [app]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    environment:
      VITE_API_BASE: /api
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "21100:5173"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    mem_limit: 1g
    networks: [app]

volumes:
  node_modules:

networks:
  app:
    name: codegen_19_task_16_net
